    <meta property="og:title" content="Obranex">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b0c14;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(253, 0, 131, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(102, 252, 241, 0.08) 0%, transparent 45%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f0f4f8;
            padding: 1.5rem;
        }
        .auth-card {
            background: #151824;
            border: 1px solid #262b40;
            border-top: 3px solid #fd0083;
            border-radius: 16px;
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.55);
        }
        .auth-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 0.9rem;
            box-shadow: 0 0 20px rgba(253, 0, 131, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 900;
            margin: 0 0 1.5rem 0;
            background: linear-gradient(135deg, #ffffff 0%, #f0abfc 50%, #66fcf1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pw-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid #262b40;
            background: #0b0c14;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .pw-input:focus {
            outline: none;
            border-color: #fd0083;
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1.25rem;
            cursor: pointer;
        }
        .unlock-btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #fd0083, #be185d);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .unlock-btn:hover { opacity: 0.9; }
        .err-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <img class="auth-logo" src="./Obranex_logo.png" alt="Obranex" onerror="this.style.display='none'">
        <h1 class="auth-title">Obranex</h1>
        <form id="unlock-form">
            <input id="pw-field" class="pw-input" type="password" placeholder="Password" autofocus>
            <label class="remember-row">
                <input id="remember-cb" type="checkbox" checked> ログイン状態を保持する
            </label>
            <button class="unlock-btn" type="submit">UNLOCK</button>
            <div id="err-msg" class="err-msg">パスワードが正しくありません</div>
        </form>
    </div>

                if (!ok) localStorage.removeItem(STORAGE_HASH_KEY);
            }
        });

        document.getElementById("unlock-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            document.getElementById("err-msg").style.display = "none";
            const pw = document.getElementById("pw-field").value;
            const remember = document.getElementById("remember-cb").checked;
            const hashHex = await deriveHash(pw);
            const ok = await tryUnlockWithHash(hashHex, remember);
            if (!ok) document.getElementById("err-msg").style.display = "block";
        });
    </script>
</body>
</html>
